name: CI

# push: branches-ignore main so a push that merges into main isn't tested
# twice (once here, once when cd.yml calls this workflow via workflow_call
# for the deploy). pull_request: every PR into main, before it can merge.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

env:
  # Credentials for the SQL Server container this job creates and destroys
  # itself: nothing outside this one run can ever reach it, so these
  # protect nothing (unlike the real per-service DB passwords, which will
  # be GitHub Actions secrets used only in cd.yml). Still derived from
  # github.run_id rather than written as a literal, so no string that
  # looks like a password ever sits in the repository or its history.
  CI_SA_PASSWORD: "P4ssw0rd-${{ github.run_id }}!"
  CI_DB_PASSWORD: "P4ssw0rd-${{ github.run_id }}-db!"

jobs:
  system-description:
    name: Validate system.yaml and OpenAPI documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: pip install pyyaml==6.0.2 jsonschema==4.23.0 openapi-spec-validator==0.7.1
      - name: Validate system.yaml against system.schema.json
        run: |
          python -c "
          import json, yaml, jsonschema
          schema = json.load(open('system.schema.json'))
          data = yaml.safe_load(open('system.yaml'))
          jsonschema.validate(data, schema)
          print('system.yaml is valid')
          "
      - name: Validate OpenAPI documents
        run: |
          openapi-spec-validator services/layouts/openapi.yaml
          openapi-spec-validator services/solver/openapi.yaml

  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [layouts, solver]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "P4ssw0rd-${{ github.run_id }}!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P P4ssw0rd-${{ github.run_id }}! -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: pip install -r requirements.txt flake8==7.1.1

      - name: Lint
        working-directory: services/${{ matrix.service }}
        run: flake8 --max-line-length=100 --exclude=.venv,__pycache__ .

      - name: Create the service databases and logins
        # Mirrors db/init.sql exactly as compose runs it locally, against
        # the sqlserver service container started for this job.
        run: |
          docker run --rm --network host \
            -v ${{ github.workspace }}/db:/scripts:ro \
            -e SA_PASSWORD="$CI_SA_PASSWORD" \
            -e LAYOUTS_DB_PASSWORD="$CI_DB_PASSWORD" \
            -e SOLVER_DB_PASSWORD="$CI_DB_PASSWORD" \
            mcr.microsoft.com/mssql/server:2022-latest \
            /bin/bash -c '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C \
              -v LayoutsPassword="$LAYOUTS_DB_PASSWORD" SolverPassword="$SOLVER_DB_PASSWORD" \
              -i /scripts/init.sql'

      - name: Test with coverage (fails under 70%)
        working-directory: services/${{ matrix.service }}
        env:
          DATABASE_URL: "mssql://${{ matrix.service }}_user:${{ env.CI_DB_PASSWORD }}@localhost:1433/${{ matrix.service }}"
        run: python -m pytest --cov=. --cov-report=term-missing --cov-fail-under=70

  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [layouts, solver]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          push: false
          load: true
          provenance: false
          tags: ${{ matrix.service }}:ci
      - name: Install Trivy
        # Pinned to the same tag as the install target, not main: a moving
        # branch for the install script itself would be exactly the
        # unpinned-supply-chain risk this whole addition is meant to guard
        # against.
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.76.2/contrib/install.sh | sh -s -- -b /usr/local/bin v0.76.2
      - name: Scan image for known CVEs (Trivy)
        # --ignore-unfixed: only CVEs Debian has actually shipped a patch
        # for, same reasoning as the Dockerfile's own apt-get upgrade step,
        # found and verified clean locally before wiring in as a gate.
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 ${{ matrix.service }}:ci

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep scan
        # --error fails the job on any finding; the two app.run(host="0.0.0.0")
        # lines and client.py's http:// LAYOUTS_URL default are suppressed
        # inline (# nosemgrep) with a comment explaining why each is correct
        # here, not disabled at the ruleset level.
        run: >
          semgrep scan --error
          --config p/security-audit
          --config p/owasp-top-ten
          services/

  sca:
    name: SCA (pip-audit) ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [layouts, solver]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Audit dependencies for known CVEs
        working-directory: services/${{ matrix.service }}
        run: pip-audit -r requirements.txt

  secrets-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default shallow clone: gitleaks scans
          # every past commit, not just the current tree, since a secret
          # removed in a later commit is still a leak (§5).
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan full git history for secrets
        run: gitleaks detect --source . -v
